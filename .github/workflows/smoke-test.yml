
name: Streamlit smoke test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14.10
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          python-version: "3.14.10"
          version: "0.13.6"

      - name: Verify lockfile
        run: uv lock --check

      - name: Synchronize locked dependencies
        run: uv sync --locked --group security

      - name: Verify patched Python runtime
        run: >-
          uv run --locked --group security python -c
          'import sys; sys.exit(0 if sys.version_info[:3] == (3, 14, 10) else f"Unexpected CPython: {sys.version}")'

      - name: Run Streamlit entry-point smoke test
        run: uv run --locked --group security python -m unittest discover -s tests -v

      - name: Run repository-wide static security scan
        run: uv run --locked --group security bandit -q -r . -x ./.venv,./.git

      - name: Audit locked dependencies
        run: uv run --locked --group security pip-audit --strict --path .venv/lib/python3.14/site-packages --progress-spinner off

      - name: Validate isolated attestation Python bootstrap without OIDC
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/attestation-bootstrap-preflight
        run: |
          set -euo pipefail
          test ! -e "$UV_PYTHON_INSTALL_DIR"
          uv python install 3.14.10
          PYTHON="$(uv python find --managed-python 3.14.10)"
          test -x "$PYTHON"
          case "$PYTHON" in
            "$UV_PYTHON_INSTALL_DIR"/*) ;;
            *) echo "Python bootstrap escaped the isolated install directory" >&2; exit 1 ;;
          esac
          "$PYTHON" -I -c 'import sys; sys.exit(0 if sys.version_info[:3] == (3, 14, 10) else 1)'

      - name: Generate and verify reproducibility evidence
        run: |
          uv run --locked --group security python scripts/repro_evidence.py create
          uv run --locked --group security python scripts/repro_evidence.py verify

      - name: Upload unsigned verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repro-evidence
          path: |
            .evidence/repro-manifest.json
            .evidence/repro-manifest.json.sha256
          if-no-files-found: error
          retention-days: 14

  attest-main:
    name: trusted-main-attestation
    # PRs and manual dispatches never receive OIDC signing privileges.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository == 'KrAZicK604/ZENITH-1-PRO-main' }}
    needs: smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned verification runtime without dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          python-version: "3.14.10"
          version: "0.13.6"

      - name: Install exact managed Python interpreter
        run: uv python install 3.14.10

      - name: Download evidence produced by this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repro-evidence
          path: .evidence
          digest-mismatch: error

      - name: Verify downloaded evidence with stdlib-only pinned Python
        run: |
          PYTHON="$(uv python find --managed-python 3.14.10)"
          test -x "$PYTHON"
          "$PYTHON" -c 'import sys; sys.exit(0 if sys.version_info[:3] == (3, 14, 10) else 1)'
          "$PYTHON" -I scripts/attestation_gate.py

      - name: Sign verified manifest and checksum provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            .evidence/repro-manifest.json
            .evidence/repro-manifest.json.sha256
